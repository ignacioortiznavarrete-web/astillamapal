<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('es-CL',{maximumFractionDigits:2}),demo=!(window.google&&google.script),charts=[];
let result=null,page=0,request=0;const size=50;
function message(text,type='warning'){ $('message').textContent=text;$('message').className='alert alert-'+type;}
function busy(value){$('apply').disabled=value;$('sync').disabled=value||demo;$('updated').textContent=value?'Consultando fuentes…':$('updated').textContent;}
function filters(){return Object.fromEntries(['from','to','supplier','product'].map(k=>[k,$(k).value]));}
function demoData(f){const base=[{id:'DEMO-001',date:'2026-10-20',supplier:'FORESTAL DEMOSTRACIÓN',product:'ASTILLA VERDE',tonnes:13.2,status:'SAP'},{id:'DEMO-002',date:'2026-10-20',supplier:'FORESTAL DEMOSTRACIÓN',product:'ASTILLA VERDE',tonnes:13.2,status:'ESTIMADO'},{id:'DEMO-003',date:'2026-10-19',supplier:'PROVEEDOR SIN SAP',product:'ASTILLA VERDE C/CORT',tonnes:11.5,status:'ESTIMADO',fallback:true}];const rows=base.filter(r=>(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to)&&(!f.supplier||r.supplier===f.supplier)&&(!f.product||r.product===f.product));const groups={};rows.forEach(r=>{const g=groups[r.supplier]||={supplier:r.supplier,estimated:0,sap:0,trucks:0};g.trucks++;g[r.status==='SAP'?'sap':'estimated']+=r.tonnes;});return {rows,groups:Object.values(groups),suppliers:[...new Set(base.map(r=>r.supplier))],warnings:[],updatedAt:new Date().toISOString(),kpis:{trucks:rows.length,pending:rows.filter(r=>r.status!=='SAP').length,estimated:rows.filter(r=>r.status!=='SAP').reduce((s,r)=>s+r.tonnes,0),sap:rows.filter(r=>r.status==='SAP').reduce((s,r)=>s+r.tonnes,0)}};}
function table(){const rows=result.rows.slice(page*size,(page+1)*size);$('rows').replaceChildren();if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='No hay ingresos para los filtros seleccionados.';tr.append(td);$('rows').append(tr);}rows.forEach(r=>{const tr=document.createElement('tr');[r.id,r.date,r.supplier,r.product,fmt.format(r.tonnes),r.status==='SAP'?'Contabilizado SAP':r.fallback?'Estimado · respaldo 11,5':'Estimado · promedio SAP'].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===4)td.className='text-end';if(i===5){const span=document.createElement('span');span.className='badge '+(r.status==='SAP'?'badge-sap':'badge-est');span.textContent=v;td.replaceChildren(span);}tr.append(td);});$('rows').append(tr);});const total=Math.max(1,Math.ceil(result.rows.length/size));$('page').textContent=`Página ${page+1} de ${total}`;$('prev').disabled=page===0;$('next').disabled=page+1>=total;}
function monthly(data){const body=$('monthly');body.replaceChildren();const records=data.reports?data.reports.monthly:[];if(!records.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.textContent=demo?'Resumen real disponible al conectar las fuentes y cargar el plan.':'No hay ingresos ni plan para el período.';tr.append(td);body.append(tr);}records.forEach(r=>{const tr=document.createElement('tr');const percent=v=>v===null?'—':fmt.format(v)+' %';[r.month,r.supplier,r.product,fmt.format(r.sap),fmt.format(r.estimated),r.plan===null?'Sin plan':fmt.format(r.plan),r.partial?'Período parcial':percent(r.sapPercent),r.partial?'Período parcial':percent(r.projectedPercent)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});body.append(tr);});}
function render(data){monthly(data);result=data;page=0;for(const k of ['trucks','pending','estimated','sap'])$(k).textContent=fmt.format(data.kpis[k]);const selected=$('supplier').value;$('supplier').replaceChildren(new Option('Todos los proveedores',''));data.suppliers.forEach(s=>$('supplier').add(new Option(s,s)));$('supplier').value=selected;$('updated').textContent='Actualizado: '+new Date(data.updatedAt).toLocaleString('es-CL');$('count').textContent=data.rows.length+' registros';table();charts.forEach(c=>c.destroy());charts.length=0;if(window.Chart){charts.push(new Chart($('volumes'),{type:'bar',data:{labels:data.groups.map(g=>g.supplier),datasets:[{label:'Estimado (t)',data:data.groups.map(g=>g.estimated),backgroundColor:'#b7d88a'},{label:'SAP (t)',data:data.groups.map(g=>g.sap),backgroundColor:'#246344'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,title:{display:true,text:'Toneladas'}}}}}));charts.push(new Chart($('states'),{type:'doughnut',data:{labels:['Pendientes','SAP'],datasets:[{data:[data.kpis.pending,data.kpis.trucks-data.kpis.pending],backgroundColor:['#b7d88a','#246344']}]},options:{responsive:true,maintainAspectRatio:false}}));}else message('No se pudo cargar Chart.js. Los indicadores y la tabla siguen disponibles.');if(data.warnings.length)message(data.warnings.slice(0,15).join(' · '));else if(demo)message('DEMOSTRACIÓN: datos ficticios. La conexión con las planillas todavía no ha sido validada.','info');else $('message').className='d-none';}
function load(){const f=filters();if(f.from&&f.to&&f.from>f.to){message('La fecha inicial debe ser anterior a la final.');return;}const current=++request;busy(true);if(demo){render(demoData(f));busy(false);return;}google.script.run.withSuccessHandler(d=>{if(current!==request)return;render(d);busy(false);}).withFailureHandler(e=>{if(current!==request)return;busy(false);$('updated').textContent='Consulta fallida; los valores anteriores pueden estar desactualizados.';message(e.message||'No fue posible consultar las fuentes.','danger');}).getDashboard(f);}
$('filters').addEventListener('submit',e=>{e.preventDefault();load();});$('prev').onclick=()=>{page--;table();};$('next').onclick=()=>{page++;table();};$('sync').onclick=()=>{busy(true);google.script.run.withSuccessHandler(r=>{busy(false);message(`Base independiente actualizada: ${r.count} registros. La sincronización incluye todos los períodos configurados.`,'success');}).withFailureHandler(e=>{busy(false);message(e.message,'danger');}).syncProcessed();};$('mode').textContent=demo?'DEMOSTRACIÓN':'GOOGLE SHEETS · LECTURA';load();
})();
</script>
